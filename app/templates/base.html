<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Personal{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="/static/output.css" rel="stylesheet">
    <script src="/static/htmx.org@2.0.9/dist/htmx.min.js"></script>
    <script src="/static/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
</head>
<body>

        <main class="flex-1 flex flex-col">

            </div>
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
